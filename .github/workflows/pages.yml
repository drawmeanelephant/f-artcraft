name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docs-repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out dogbed (pinned)
        uses: actions/checkout@v4
        with:
          repository: drawmeanelephant/dogbed
          ref: 0c94175e25483a9146939d9d4ca87b11ee7d311e
          path: dogbed-src
      - name: Install Zig 0.17.0
        run: |
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          mkdir -p /tmp/zig && tar -xf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
      - name: Build dogbed
        run: cd dogbed-src && zig build
      - name: Regenerate data + site
        run: |
          python3 docs/gen_data.py
          DOGBED=dogbed-src/zig-out/bin/dogbed sh docs/build.sh
      # Advisory only: the deploy job regenerates docs/ on every main push
      # and commits it back, so committed output self-heals. A real render
      # break still fails above (nonzero exit), but drift is a warning.
      - name: Report stale docs (advisory)
        run: |
          if ! git diff --quiet docs/; then
            git diff --stat docs/
            echo "::warning title=stale docs::docs/ generated output is behind the artwork — the deploy job will regen and commit it on main"
          fi

  deploy:
    if: github.ref == 'refs/heads/main'
    # Deploys queue instead of cancelling: a merge storm only ever leaves
    # one in-flight + one pending (newest wins the pending slot), so the
    # site always converges on latest main instead of starving.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out dogbed (pinned)
        uses: actions/checkout@v4
        with:
          repository: drawmeanelephant/dogbed
          ref: 0c94175e25483a9146939d9d4ca87b11ee7d311e
          path: dogbed-src
      - name: Install Zig 0.17.0
        run: |
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          mkdir -p /tmp/zig && tar -xf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
      - name: Build dogbed
        run: cd dogbed-src && zig build
      # Rebuild on top of latest origin/main, and if the generated output
      # drifted, commit it back so docs/ never rots. Retries absorb the
      # plate-merge race: a rejected push just means re-sync and regen.
      - name: Build docs/site and commit regenerated docs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python3 docs/gen_data.py
            DOGBED=dogbed-src/zig-out/bin/dogbed sh docs/build.sh
            if git diff --quiet docs/; then
              echo "docs/ is fresh — nothing to commit"
              break
            fi
            git add docs/
            git commit -m "chore: regen docs/site [skip ci]"
            if git push origin HEAD:main; then
              echo "committed regenerated docs/ to main"
              break
            fi
            echo "push raced a newer main (attempt $i) — retrying"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - uses: actions/deploy-pages@v4
        id: deployment
