name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Queue, never cancel mid-flight: each ref gets one running + one pending
# (newest) run. Plate merges coalesce; the newest queued run deploys the
# rolled-up state. Cancelling in-flight starves deploys under merge storms.
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out media branch for PNG exports
        uses: actions/checkout@v4
        with:
          ref: media
          path: media
      - name: Check out dogbed (pinned)
        uses: actions/checkout@v4
        with:
          repository: drawmeanelephant/dogbed
          ref: 0c94175e25483a9146939d9d4ca87b11ee7d311e
          path: dogbed-src
      - name: Install Zig 0.17.0
        run: |
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          mkdir -p /tmp/zig && tar -xf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
      - name: Build dogbed
        run: cd dogbed-src && zig build
      # docs/data + docs/site are build artifacts (untracked) — this job
      # only proves the scan + render pipeline still works end to end.
      - name: Regenerate data + site
        run: |
          python3 docs/gen_data.py --png-root media
          DOGBED=dogbed-src/zig-out/bin/dogbed sh docs/build.sh

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out media branch for PNG exports
        uses: actions/checkout@v4
        with:
          ref: media
          path: media
      - name: Check out dogbed (pinned)
        uses: actions/checkout@v4
        with:
          repository: drawmeanelephant/dogbed
          ref: 0c94175e25483a9146939d9d4ca87b11ee7d311e
          path: dogbed-src
      - name: Install Zig 0.17.0
        run: |
          curl -sL -o /tmp/zig.tar.xz https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          mkdir -p /tmp/zig && tar -xf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"
      - name: Build dogbed
        run: cd dogbed-src && zig build
      # Build on top of latest origin/main so the artifact always reflects
      # the newest merged artwork, not whatever this run's commit pinned.
      - name: Build docs/site
        run: |
          git fetch origin main
          git reset --hard origin/main
          python3 docs/gen_data.py --png-root media
          DOGBED=dogbed-src/zig-out/bin/dogbed sh docs/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - uses: actions/deploy-pages@v4
        id: deployment
